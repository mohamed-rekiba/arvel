[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arvel"
dynamic = [
  "version",
] # V1: single-sourced from arvel.__version__ (release-please managed)
description = "A batteries-included web framework for Python — async-first, type-safe, modular."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "arvel" }]
keywords = ["framework", "web", "async", "fullstack", "asgi"]
dependencies = [ # CORE — light, no heavy libs
  "msgspec>=0.21.1",
  "whenever>=0.10.0",
  "typer>=0.26.8",
  "structlog>=26.1.0",
  "httpx>=0.28.1",
  "anyio>=4.14.1",
  "python-ulid>=3.1.0",
  # python-ulid 3.1.0 imports typing_extensions at module import but doesn't declare it —
  # without this, a bare `pip install arvel` can't even `import arvel.support` (the dev
  # extras masked it). Drop when upstream fixes its metadata.
  "typing-extensions>=4.0",
  "itsdangerous>=2.2.0",
  "cryptography>=49.0.0",
  "pwdlib[argon2,bcrypt]>=0.3.0",
  "inflection>=0.5.1",
  "python-slugify>=8.0.4",
  "cashews>=7.5.0",
  "fsspec>=2026.6.0",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
http = ["litestar>=2.24.0"]
server = ["granian[reload]>=2.7.7", "uvicorn>=0.49.0"]
postgres = ["sqlalchemy[asyncio]>=2.0.51", "alembic>=1.18.5", "asyncpg>=0.31.0"]
mysql = ["sqlalchemy[asyncio]>=2.0.51", "alembic>=1.18.5", "asyncmy>=0.2.11"]
sqlite = ["sqlalchemy[asyncio]>=2.0.51", "alembic>=1.18.5", "aiosqlite>=0.22.1"]
redis = ["redis>=8.0.1"]
queue = [
  "taskiq>=0.12.4",
] # core queue engine (in-memory broker); add a broker extra for production
queue-redis = ["arvel[queue]", "taskiq-redis>=1.2.3"] # Redis broker
queue-amqp = [
  "arvel[queue]",
  "taskiq-aio-pika>=0.6.0",
] # AMQP broker (RabbitMQ/LavinMQ via taskiq AioPikaBroker)
view = ["jinja2>=3.1.6"]
console = [
  "ipython>=9.15.0",
] # the `arvel shell` REPL: top-level await + autocomplete (falls back to stdlib)
jwt = ["pyjwt>=2.13.0"]
# OIDC / IdP SSO (Keycloak etc.): validate bearer JWTs against the IdP JWKS — auth.oidc.jwks_verifier
# uses pyjwt's PyJWKClient (JWKS fetched via urllib; no extra HTTP dep).
oidc = ["pyjwt[crypto]>=2.13.0"]
oauth = ["httpx-oauth>=0.17.0", "authlib>=1.7.2"]
"2fa" = ["pyotp>=2.10.0"]
s3 = ["s3fs>=2026.6.0"]
gcs = ["gcsfs>=2026.6.0"]
azure = ["adlfs>=2026.5.0"]
supabase = ["supabase>=2.31.0"]
image = ["pillow>=12.2.0"]
video = ["av>=17.1.0"]
media = ["arvel[image]"]
mail = ["aiosmtplib>=5.1.2", "markdown-it-py>=4.2.0"]
notifications = ["apprise>=1.11.0"]
search = ["meilisearch>=0.41.1"]
# pgvector powers `t.vector(...)` columns + vector search on Postgres. The Python package
# provides the SQLAlchemy type; it ALSO requires the Postgres server extension
# (`CREATE EXTENSION vector;`). Without the package, `t.vector` falls back to a portable JSON column.
vector = ["pgvector>=0.4.2"]
telemetry = [
  "opentelemetry-sdk>=1.43.0",
  "opentelemetry-exporter-otlp-proto-http>=1.42.1", # the default OTLP/HTTP push (traces/metrics/logs)
  "opentelemetry-exporter-prometheus>=0.50b0",      # optional pull mode (the /metrics scrape route)
  "prometheus-client>=0.20.0",                      # exposition format for the /metrics handler
  "sentry-sdk>=2.63.0",
]
i18n = ["babel>=2.18.0"]
docs = ["zensical>=0.0.46"]
dev = [
  "ruff>=0.15.20",
  "mypy>=2.1.0",
  "pyright>=1.1.411",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.0",
  "import-linter>=2.12",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-xdist>=3.8.0",
  "coverage>=7.14.3",
  "polyfactory>=3.3.0",
  "faker>=40.23.0",
  "moto>=5.2.2",
  "ipython>=9.15.0",
  "hypothesis>=6.155.7",
]
test-integration = ["testcontainers>=4.14.2"]
standard = ["arvel[http,server,console]"]
all = [
  "arvel[http,server,sqlite,postgres,mysql,redis,queue-redis,queue-amqp,view,console,jwt,oidc,oauth,2fa,s3,gcs,azure,supabase,image,video,media,mail,notifications,search,vector,telemetry,i18n]",
]

[project.scripts]
arvel = "arvel.console:main"

[project.entry-points."arvel.providers"]
kernel = "arvel.kernel.provider:KernelServiceProvider"
events = "arvel.events.provider:EventServiceProvider"
security = "arvel.security.provider:SecurityServiceProvider"
client = "arvel.client.provider:ClientServiceProvider"
routing = "arvel.routing.provider:RoutingServiceProvider"
database = "arvel.database.provider:DatabaseServiceProvider"
cache = "arvel.cache.provider:CacheServiceProvider"
filesystem = "arvel.filesystem.provider:FilesystemServiceProvider"
mail = "arvel.mail.provider:MailServiceProvider"
notifications = "arvel.notifications.provider:NotificationServiceProvider"
view = "arvel.views.provider:ViewServiceProvider"
queue = "arvel.queue.provider:QueueServiceProvider"
auth = "arvel.auth.provider:AuthServiceProvider"
media = "arvel.media.provider:MediaServiceProvider"
validation = "arvel.validation.provider:ValidationServiceProvider"
dates = "arvel.dates.provider:DateServiceProvider"
localization = "arvel.localization.provider:LocalizationServiceProvider"
search = "arvel.search.provider:SearchServiceProvider"
features = "arvel.features.provider:FeatureServiceProvider"
telemetry = "arvel.telemetry.provider:TelemetryServiceProvider"
broadcasting = "arvel.broadcasting.provider:BroadcastServiceProvider"

[tool.hatch.version]
path = "src/arvel/__init__.py" # reads __version__ (V1: one source of truth)

[tool.hatch.build.targets.wheel]
packages = ["src/arvel"]

# --- UV --------------------------------------------------------
[tool.uv]
compile-bytecode = true
# supply-chain cooldown (same posture as the dependabot cooldown + SHA-pinned actions):
# wait out newly published package versions before resolving them
exclude-newer = "7 days"

# --- Lint / format --------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Generated facade stub: `make stubs` emits it verbatim and test_facade_stubs asserts the file
# equals the generator output. ruff-format must not rewrap it. force-exclude so the pre-commit
# ruff hooks (which pass filenames explicitly) honor the exclusion too.
extend-exclude = ["src/arvel/support/facades/__init__.pyi"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["E501"]                                            # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "S105",
  "S106",
  "S107",
  "S311",
  "S404",
  "S603",
  "S607",
  "B018",
  "RUF012",
]
"src/arvel/console/**" = [
  "B008",
  "S603",
] # Typer callable defaults; `serve` runs granian (fixed argv)

# --- Types (G3) -----------------------------------------------------------
[tool.mypy]
strict = true
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# Pyright narrows Any to Unknown more aggressively than mypy, so casts that satisfy pyright
# read as redundant to mypy — disable this one check rather than fight the two checkers.
warn_redundant_casts = false

[[tool.mypy.overrides]]
module = ["babel", "babel.*", "fsspec", "fsspec.*", "av", "av.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# Third-party engines (fsspec, av, …) ship no stubs; reportUnknown* stays on for our own code.
reportMissingTypeStubs = false

# --- Tests ----------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default suite stays hermetic + fast: the Docker-backed integration tier is opt-in
# (`pytest -m integration` / `make test-integration`).
addopts = "-q -m 'not integration'"
markers = [
  "integration: real-service tests (Postgres/Redis/… via testcontainers; needs Docker)",
]

[tool.coverage.run]
source = ["arvel"]
branch = true

# --- Security -------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]

# --- G1 module boundaries (import-linter) ---------------------------------
[tool.importlinter]
root_package = "arvel"
include_external_packages = true
# The lazy public surface re-exports capability types under `if TYPE_CHECKING:`;
# those are type-only, not runtime imports, so they must not count as edges.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "G1 — module dependency DAG (layered, acyclic)"
type = "layers"
# Topological order, highest first — each module is its own layer, so any back-edge is a red
# build. Enforces the DR-0003/DR-0026 dependency direction; `ignore_imports` stays empty on purpose.
layers = [
  "arvel.routing",
  "arvel.views",
  "arvel.notifications",
  "arvel.mail",
  "arvel.queue",
  "arvel.console",
  "arvel.auth",
  "arvel.http",
  "arvel.validation",
  "arvel.testing",
  "arvel.media",
  "arvel.activitylog",
  "arvel.features",
  "arvel.database",
  "arvel.client",
  "arvel.cache",
  "arvel.telemetry",
  "arvel.search",
  "arvel.pagination",
  "arvel.filesystem",
  "arvel.broadcasting",
  "arvel.support",
  "arvel.security",
  "arvel.dates",
  "arvel.localization",
  "arvel.events",
  "arvel.kernel",
  "arvel.contracts",
]

[[tool.importlinter.contracts]]
name = "G2 — light core imports no heavy libs (startup NFR)"
type = "forbidden"
# The light core must never import a heavy lib (even lazily). Capability modules
# (http→litestar, database→sqlalchemy, queue→taskiq, media→PIL) DO lazy-import their
# engine; that `import arvel` stays light is guaranteed by the -X importtime pytest.
source_modules = [
  "arvel.contracts",
  "arvel.kernel",
  "arvel.support",
  "arvel.dates",
  "arvel.localization",
  "arvel.events",
  "arvel.console",
  "arvel.security",
  "arvel.client",
]
forbidden_modules = ["litestar", "sqlalchemy", "taskiq", "PIL", "rich"]
