[project]
name = "arvel-workspace"
version = "0.0.0"        # x-release-please-version

description = "Arvel monorepo — framework + cli + skeleton + docs + benchmarks."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arvel = { workspace = true }
arvel-permission = { workspace = true }
arvel-image = { workspace = true }
arvel-oauth = { workspace = true }
arvel-search = { workspace = true }
arvel-audit = { workspace = true }

[dependency-groups]
dev = [
    "arvel[all]",
    "arvel-permission",
    "arvel-image",
    "arvel-oauth",
    "arvel-search",
    "arvel-audit",
    "bandit>=1.9.4",
    "coverage[toml]>=7.14.1",
    "cyclonedx-bom>=7.3.0",
    "mkdocs-github-admonitions-plugin>=0.1.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
    "aiosqlite>=0.22.1",
    "testcontainers>=4.14.2",
]

# ──────────────────────────  Shared tooling (workspace-wide)  ──────────────────

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docstrings — enable per-module
    "ANN401", # narrowly-scoped Any in container/facades
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
    "TC001",  # TYPE_CHECKING imports — judgement-based
    "TC002",
    "TC003",
    "TRY003", # framework-style error messages
    "EM101",  # short literal exception messages are fine for the framework
    "EM102",
    "UP046",  # classic Generic[T] kept for editor/runtime compat across tools
    "UP047",  # PEP 695 not used everywhere yet — TypeVar still valid
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",
    "S105",     # test fixtures hardcode obvious secrets
    "S106",
    "PLR2004",
    "SLF001",
    "ARG001",
    "ARG002",
    "PLR0913",
    "FBT001",
    "FBT002",
    "FBT003",
    "INP001",
    "ANN001",
    "ANN201",
    "N802",     # tests intentionally use TypeVar `T` in names
    "N806",     # nested Pydantic model defs read better Pascal-cased
    "A002",     # `id` argument shadowing is fine in test doubles
    "PT018",    # multi-assert composite assertion is fine here
    "PLW0108",
    "PTH201",
    "PLC0415",  # scoped imports keep test files self-contained
    "RUF043",   # pytest.raises(match=...) regex flexibility
    "RUF012",   # mutable defaults are fine for test data
    "ASYNC240", # sync pathlib in async test helpers is fine (asyncio backend)
    "TRY301",   # raising inside try accepted in test helpers
    "RUF006",   # asyncio.create_task without assignment OK in tests
    "PT011",    # bare pytest.raises(ValueError) acceptable in provider tests
    "BLE001",   # broad except in cookie encryption test is intentional
]
"**/benchmarks/**" = ["S101", "INP001", "T201", "E501"]
"conftest.py" = [
    "UP036",   # tomllib fallback is intentional for portability
    "UP037",   # TYPE_CHECKING-guarded names are stringified by design
    "PLC0415", # `coverage` imported lazily — pytest-cov owns the runtime
    "S112",    # silent continue keeps the per-module gate non-fatal
    "ARG001",  # pytest hook signature is fixed
    "PLW0603", # _PENDING_FAILURE is the only state shared across hooks
]
"packages/arvel/src/arvel/container/**" = [
    "SLF001",
    "C901",
    "PLR0911",
    "PLR0912",
]
"packages/arvel/src/arvel/application/**" = ["SLF001", "PLC0415"]
"packages/arvel-ecommerce-demo/backend/bootstrap/app.py" = [
    "E402", # sys.path must be set before local app.* imports can resolve
]
"packages/arvel-permission/src/arvel_permission/models.py" = [
    "ARG002", # TypeDecorator.process_*_param must keep SQLAlchemy's `dialect` name
]
"packages/arvel-oauth/src/arvel_oauth/exceptions.py" = [
    "N818",    # ProviderNotFound / InvalidOAuthState / DuplicateOAuthAccount are public API names
]
"packages/arvel-oauth/src/arvel_oauth/models.py" = [
    "ARG002", # TypeDecorator.process_*_param must keep SQLAlchemy's `dialect` name
]
"packages/arvel-oauth/src/arvel_oauth/providers/**" = [
    "PLR0913", # OAuth provider constructors carry the full credential + endpoint param set
]
"packages/arvel-search/src/arvel_search/exceptions.py" = [
    "N818", # SearchEngineNotConfigured is a public API name, not an *Error
]
"packages/arvel-audit/src/arvel_audit/exceptions.py" = [
    "N818", # InvalidAuditAction / MissingActivityDescription are public API names, not *Error
]
"packages/arvel-audit/src/arvel_audit/types.py" = [
    "ARG002",  # TypeDecorator.process_*_param must keep SQLAlchemy's `dialect` name
    "PLC0415", # Crypt imported lazily so importing the model never needs APP_KEY
]
"packages/arvel-audit/src/arvel_audit/auditable.py" = [
    "SLF001", # observer stashes a private capture attr on the instance between hooks
]
"packages/arvel-search/src/arvel_search/engines/**" = [
    "ARG002",  # Engine protocol methods keep a fixed (index, documents, key) signature
    "PLR0913", # the REST drivers' private _request helper carries the full httpx knob set
]
"packages/arvel-search/src/arvel_search/searchable.py" = [
    "PLC0415", # Bus/jobs imported lazily inside dispatch to break the queue import cycle
]
"packages/arvel-search/src/arvel_search/facade.py" = [
    "PLC0415", # SearchFake imported lazily to keep test doubles out of the prod path
]
"packages/arvel-ecommerce-demo/backend/app/http/controllers/i18n.py" = [
    "RUF001", # intentional Turkish locale strings — dotless-i is correct spelling
]
"packages/arvel-ecommerce-demo/backend/database/seeders/catalog_seeder.py" = [
    "RUF001", # intentional Turkish locale strings — dotless-i is correct spelling
    "E501",   # long seeder data lines are intentional (readability beats wrapping)
]
"packages/arvel/src/arvel/http/**" = [
    "PLC0415", # lazy imports avoid heavy FastAPI/jwt at module load
    "PLR0913", # CORS / Throttle constructors have many tunables
    "BLE001",  # broad except in middleware: convert any guard error to 401
    "N818",    # HttpException name is canonical; subclasses already follow OWASP
]
"packages/arvel/src/arvel/routing.py" = [
    "BLE001",  # annotation resolution is best-effort, must not crash
    "C901",    # signature rewriting is intrinsically a multi-branch routine
    "PLC0415", # localized imports for optional integrations
    "PLR0913", # facade decorator factories carry the full route knob set
    "S110",    # try/except/pass for annotation resolution is intentional
    "SIM108",  # explicit if/else reads better than the ternary for None checks
]
"packages/arvel/src/arvel/providers/**" = [
    "PLW0108", # lambda binds Router.singleton lazily
    "BLE001",  # provider boot/shutdown converts arbitrary backend errors
    "S110",    # try/except/pass guards optional config sections
    "PLC0415", # lazy imports for optional driver registration
    "SLF001",  # providers peek at manager._config to validate
]
"packages/arvel/src/arvel/cache/**" = [
    "PLC0415",  # lazy driver imports keep optional deps optional
    "ARG002",   # protocol methods accept fixed signatures (NullStore, FileStore)
    "N818",     # CacheException is intentional base-class name
    "ASYNC109", # block(timeout=...) is explicit by design — asyncio.timeout adds no value here
    "S311",     # random.randint for GC probability is not cryptographic
]
"packages/arvel/src/arvel/session/**" = [
    "PLC0415", # lazy driver imports
    "ARG002",  # SessionStore protocol methods accept fixed signatures
    "SLF001",  # StartSession accesses manager._config internals
    "BLE001",  # broad except in middleware prevents 500 on session errors
]
"packages/arvel/src/arvel/storage/**" = [
    "PLC0415", # lazy cloud driver imports
    "ARG002",  # StorageDisk protocol methods accept fixed signatures
    "PLR0913", # StorageManager.__init__ carries per-driver config objects
]
"packages/arvel/src/arvel/console/commands/cache_commands.py" = [
    "PLC0415", # façade and fallback store imported lazily inside CLI handlers
    "BLE001",  # CLI fallback: catch-all when facade not bound is intentional
    "SLF001",  # accessing Cache._mgr() is intentional — it's the internal gateway
]
"packages/arvel/src/arvel/console/entrypoint.py" = [
    "PLC0415", # cache/storage commands imported lazily to keep startup fast
]
"packages/arvel/src/arvel/facades/**" = [
    "PLC0415", # concrete types imported lazily inside bind() to break circular deps
]
"packages/arvel/src/arvel/queue/**" = [
    "PLC0415",  # lazy driver imports keep optional deps optional
    "ARG002",   # QueueConnection protocol methods accept fixed signatures
    "N818",     # QueueException is intentional base-class name
    "ASYNC109", # pop_blocking(timeout=...) is explicit by design — asyncio.timeout adds no value
    "BLE001",   # worker/database broad except: failed jobs must not crash the loop
    "S110",     # worker/database try/except/pass: failed job silently stored in failed_jobs table
    "SLF001",   # DatabaseConnection._record_unknown_class accesses store._engine directly
]
"packages/arvel/src/arvel/mail/**" = [
    "PLC0415", # lazy driver imports keep optional deps optional
    "N818",    # MailException is intentional base-class name
]
"packages/arvel/src/arvel/notifications/**" = [
    "PLC0415", # lazy driver/channel imports keep optional deps optional
    "N818",    # NotificationException is intentional base-class name
    "ARG002",  # channel protocol methods accept fixed (notifiable, notification) signatures
    "BLE001",  # bootstrap try/except: channels silently disabled if deps absent
    "SIM105",  # contextlib.suppress is less readable for bootstrap try/except blocks
    "S110",    # bootstrap try/except/pass: channels disabled gracefully, not crashed
]
"packages/arvel/src/arvel/broadcasting/**" = [
    "PLC0415", # lazy driver imports keep optional deps optional (redis, httpx)
    "N818",    # BroadcastException is intentional base-class name
    "RUF012",  # ReverbConfig.allowed_origins defaults to [] — pydantic deep-copies
]
"packages/arvel/src/arvel/reverb/**" = [
    "PLC0415",  # lazy import of websockets (optional broadcasting extra)
    "PLR0913",  # channel-auth signature helpers carry the full Pusher param set
    "ASYNC109", # RedisBus.subscribe pumps with an explicit timeout — required by redis-py
    "SIM105",   # contextlib.suppress is less readable for the ws.close() guard
    "S110",     # ws.close() failure is intentional silent — connection already gone
    "BLE001",   # routing JSON parse + ws.send fan-out: catch all to avoid loop crash
]
"packages/arvel/src/arvel/console/commands/reverb_commands.py" = [
    "PLC0415", # lazy import keeps `arvel` CLI startup fast even without reverb extra
]
"packages/arvel/src/arvel/events/**" = [
    "PLC0415", # lazy imports to avoid circular deps (Bus ↔ EventDispatcher)
    "S110",    # Bus fallback: ShouldQueue listeners fall back to inline silently
    "BLE001",  # ShouldQueue Bus fallback swallows FacadeNotBoundError intentionally
]
"packages/arvel/src/arvel/database/**" = [
    "ARG001",  # SQLAlchemy event handlers receive (mapper, conn, target) — only target is used
    "ARG002",  # TypeDecorator API: (value, dialect) signature is fixed
    "PLC0415", # lazy imports break ORM↔HTTP/routing import cycles
    "PLR2004", # cryptographic key sizes (32) are domain constants, not magic
    "SLF001",  # QueryBuilder.clone() legitimately copies sibling state
    "TRY004",  # AttributeError is the documented contract for "no such column"
    "FBT001",  # Blueprint helpers expose `nullable=True` keyword-style booleans
    "FBT002",
    "SIM103",  # explicit return reads better in tree-walking helpers
    "PLR0913", # Schema DSL builder methods carry intentional multi-param signatures
]
"packages/arvel/src/arvel/support/annotations.py" = [
    "S110",   # PEP-563 fallback chain must never crash on bad annotations
    "BLE001",
]
"packages/arvel/src/arvel/scheduling/**" = [
    "N802",    # Laravel-parity DSL: dailyAt, weeklyOn, onOneServer, withoutOverlapping
    "N807",    # __() / __choice() naming follows Laravel — kept module-level only
    "PLC0415", # lazy imports break circular deps with cache/log managers
    "PLR2004", # cron field counts (5) and minute-bounds are domain constants
    "BLE001",  # serve_forever() must catch any task failure and keep ticking
    "S110",    # auto-discovery best-effort: missing app/Console/Kernel.py is OK
    "T201",    # CLI commands print to stdout (typer.echo wraps print)
]
"packages/arvel/src/arvel/logging/**" = [
    "PLC0415", # request-context import is lazy to break the observability → logging circular dep
]
"packages/arvel/src/arvel/logging_/**" = [
    "PLC0415", # request-context import is lazy to break the observability → providers → logging circular dep
    "PLW0603", # _bind() sets the module-level facade singleton
    "E501",    # log method signatures expose explicit kwargs for IDE introspection
]
"packages/arvel/src/arvel/i18n/**" = [
    "N802",    # Laravel-parity: __, __choice
    "N807",
    "PLC0415", # lazy module imports for translation files
    "PLW0603", # bind_translator() sets the module-level translator singleton
    "BLE001",  # loader must not crash on a malformed .py file
    "S110",
    "SIM108",  # pluralization branching is clearer as an if/else than a ternary
]
"packages/arvel/src/arvel/providers/scheduler_provider.py" = [
    "BLE001",  # boot() auto-discovery best-effort: log + continue
    "S110",
    "PLC0415", # lazy imports avoid loading scheduling/cache at provider import time
]
"packages/arvel/src/arvel/console/commands/schedule_commands.py" = [
    "PLC0415", # CLI handlers lazy-import schedule/cache/log to keep CLI startup fast
    "S108",    # /tmp default is for --once dry-run only; never reaches FS in tests
    "ANN202",  # _build_kernel returns a SchedulerKernel via forward-typed factory
    "FBT002",  # CLI flag `once: bool = False` is the standard typer signature
    "E501",    # CLI signature lines exceed 100 due to typer Annotated decorators
]
"packages/arvel/src/arvel/testing/**" = [
    "PLC0415", # lazy imports across testing.fakes break circular deps with facades
    "S108",    # /tmp default is for testing only (file_path is unused by ARRAY store)
    "SLF001",  # OTel private provider variables must be patched to enable test swapping
    "TRY004",  # AssertionError is the documented contract for fake-not-active failures
    "PLR2004", # 200..300 boundary is documented in Python — not a magic number
    "PLR1714", # the chained-equality form is explicit on purpose in key matching
    "SIM109",  # status code 2xx range check is more readable as written
    "E501",    # docstring lines hold copy-paste-ready user examples; do not wrap
    "ARG002",  # LockFake mirrors CacheLock's signature for drop-in substitutability
    "ASYNC109", # LockFake.block(timeout=...) mirrors CacheLock — asyncio.timeout adds no value
]
"packages/arvel/src/arvel/observability/**" = [
    "PLC0415", # optional OTel exporters/instrumentors imported lazily to keep startup fast
    "SLF001",  # provider.py must patch OTel private globals to support test provider swapping
]
"packages/arvel/src/arvel/facades/cache.py" = [
    "PLC0415", # lazy fake-context import to avoid pulling test deps in prod paths
    "TRY004",  # AssertionError is the documented contract for fake-not-active failures
]
"packages/arvel/src/arvel/facades/event.py" = [
    "PLC0415", # lazy fake-context import
    "TRY004",
]
"packages/arvel/src/arvel/facades/storage.py" = [
    "PLC0415", # lazy fake-context import
    "TRY004",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = "packages/arvel/src:packages/arvel-permission/src:packages/arvel-image/src:packages/arvel-oauth/src:packages/arvel-oauth:packages/arvel-search/src:packages/arvel-audit/src"
files = [
    "packages/arvel/src",
    "packages/arvel/tests",
    "packages/arvel-permission/src",
    "packages/arvel-permission/tests",
    "packages/arvel-image/src",
    "packages/arvel-image/tests",
    "packages/arvel-oauth/src",
    "packages/arvel-oauth/tests",
    "packages/arvel-audit/src",
    "packages/arvel-search/src",
    # arvel-search and arvel-audit tests are namespace dirs under hyphenated
    # packages, so each tests/conftest resolves to the bare module `conftest`
    # and would collide with the others (and with arvel-permission) under the
    # flat run. Checked in isolation via dedicated `mypy packages/<pkg>/tests`
    # steps (see Makefile).
]
# The skeleton tree is template content, not framework source — it runs under
# a generated project's sys.path (where `bootstrap.app` exists), not the
# installer's. Mirror the pyright exclude below to keep both checkers aligned.
exclude = ["packages/arvel/src/arvel/_skeleton"]

# Optional runtime dependencies — may or may not be installed in a given env.
# ignore_missing_imports covers the "not installed" case without requiring
# per-line `type: ignore[import-not-found]` noise in the framework source.
[[tool.mypy.overrides]]
module = [
    "redis",
    "redis.*",
    "IPython",
    "IPython.*",
    "azure",
    "azure.*",
    "google",
    "google.*",
    "aioboto3",
    "aioboto3.*",
    "bcrypt",
    "bcrypt.*",
    "jwt",
    "jwt.*",
    "aiosmtplib",
    "aiosmtplib.*",
    "taskiq_redis",
    "taskiq_redis.*",
    "croniter",
    "croniter.*",
    "yaml",
    "yaml.*",
    "testcontainers",
    "testcontainers.*",
    "docker",
    "docker.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "packages.arvel.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# QA-Pre test files intentionally import modules that don't exist yet (RED state).
# ignore_errors avoids spurious import-not-found and misc(subclass-of-Any) errors
# that disappear once Stage 3b (Execution) ships the implementation.
[[tool.mypy.overrides]]
module = [
    "packages.arvel.tests.console.*",
    "packages.arvel.tests.database.test_belongs_to_many",
    "packages.arvel.tests.database.test_morph",
    "packages.arvel.tests.database.benchmarks.*",
    "packages.arvel.tests.cache.stores.test_redis_store",
    "packages.arvel.tests.session.stores.test_redis_store",
    "packages.arvel.tests.test_auth.unit.test_throttle_login",
    "packages.arvel.tests.test_auth.unit.test_csrf_double_submit",
    "packages.arvel.tests.test_auth.integration.test_mailables",
]
ignore_errors = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = [
    "packages/arvel/src",
    "packages/arvel/tests",
    "packages/arvel-permission/src",
    "packages/arvel-permission/tests",
    "packages/arvel-image/src",
    "packages/arvel-image/tests",
    "packages/arvel-oauth/src",
    "packages/arvel-oauth/tests",
    "packages/arvel-audit/src",
    "packages/arvel-audit/tests",
    "packages/arvel-search/src",
    "packages/arvel-search/tests",
]
# The skeleton tree is template content, not framework source — it runs
# under a generated project's sys.path, not the framework's, so imports
# like `from bootstrap.app import ...` can't resolve here.
exclude = ["packages/arvel/src/arvel/_skeleton"]
# QA-Pre test files were excluded during RED state; all tests are now GREEN.
ignore = [
    "packages/arvel/tests/database/benchmarks",
    "packages/arvel/tests/cache/stores/test_redis_store.py",
    "packages/arvel/tests/session/stores/test_redis_store.py",
]
reportMissingTypeStubs = "warning"
reportMissingImports = "warning"
extraPaths = [
    "packages/arvel/src",
    "packages/arvel-permission/src",
    "packages/arvel-image/src",
    "packages/arvel-oauth/src",
    "packages/arvel-audit/src",
    "packages/arvel-search/src",
    "packages/arvel-search/tests",
]
# All `report*` checks promoted to error. Per `enforce-quality-gates.mdc`,
# warnings are not acceptable: every finding must be resolved with a real
# code change, not a config downgrade or per-line suppression. Tighten,
# don't loosen.
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportPrivateUsage = "error"
reportUnusedFunction = "error"
reportUnusedClass = "error"
reportUnusedImport = "error"
reportArgumentType = "error"
reportAttributeAccessIssue = "error"
strictListInference = false
strictDictionaryInference = false
strictSetInference = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config -m 'not benchmark'"
python_files = ["test_*.py", "bench_*.py"]
testpaths = [
    "packages/arvel/tests",
    "packages/arvel-permission/tests",
    "packages/arvel-image/tests",
    "packages/arvel-oauth/tests",
    "packages/arvel-audit/tests",
    "packages/arvel-search/tests",
]
markers = [
    "slow: marks tests as slow",
    "unit: pure-unit tests with no external dependencies",
    "integration: integration tests",
    "security: security tests",
    "benchmark: ORM and core performance benchmarks (requires pytest-benchmark)",
    "requires_emulator: requires a Docker-hosted backend (moto, Azurite, fake-gcs)",
]

[tool.coverage.run]
source = ["packages/arvel/src/arvel", "packages/arvel-permission/src/arvel_permission"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 90

# Per-module coverage floors. Enforced by the workspace-root
# conftest.py after pytest-cov finishes. Floors are *minimums*: pinned just
# below the current measured number so refactors don't get blocked, and raised
# whenever real coverage climbs durably. Current numbers (2026-05-17):
#   application  95.58 | config   99.19 | container 92.67 | database  93.95
#   facades     100.00 | http     94.90 | providers 85.71 | routing   94.33
#   support      92.57
[tool.coverage.arvel_per_module]
"arvel.application" = 93.0
"arvel.config" = 95.0
"arvel.container" = 90.0
"arvel.database" = 92.0
"arvel.facades" = 100.0
"arvel.http" = 92.0
"arvel.providers" = 80.0
"arvel.routing" = 92.0
"arvel.support" = 90.0
