[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arvel"
dynamic = ["version"]  # V1: single-sourced from arvel.__version__ (release-please managed)
description = "A Laravel-grade web framework for Python — async-first, type-safe, modular."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "arvel" }]
keywords = ["framework", "web", "async", "laravel", "asgi"]
dependencies = [   # CORE — light, no heavy libs
  "msgspec",
  "whenever",
  "typer",
  "structlog",
  "httpx",
  "anyio",
  "python-ulid",
  "itsdangerous",
  "cryptography",
  "pwdlib[argon2]",
  "inflection",
  "python-slugify",
  "cashews",
  "fsspec",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
http = ["litestar"]
server = ["granian[reload]", "uvicorn"]
settings = []  # typed settings are msgspec-based (core) — no pydantic (DR-0005)
postgres = ["sqlalchemy[asyncio]>=2", "alembic", "asyncpg"]
mysql = ["sqlalchemy[asyncio]>=2", "alembic", "asyncmy"]
sqlite = ["sqlalchemy[asyncio]>=2", "alembic", "aiosqlite"]
redis = ["redis>=8"]
queue = ["taskiq"]  # core queue engine (in-memory broker); add a broker extra for production
queue-redis = ["arvel[queue]", "taskiq-redis"]  # Redis broker
queue-amqp = ["arvel[queue]", "taskiq-aio-pika"]  # AMQP broker (RabbitMQ/LavinMQ via taskiq AioPikaBroker)
view = ["jinja2"]
console = ["ipython"]  # the `arvel shell` REPL: top-level await + autocomplete (falls back to stdlib)
vue = []
react = []
svelte = []
auth = []
jwt = ["pyjwt"]
oauth = ["httpx-oauth", "authlib"]
"2fa" = ["pyotp"]
refresh = []
rbac = []
s3 = ["s3fs"]
gcs = ["gcsfs"]
azure = ["adlfs"]
supabase = ["supabase"]
image = ["pillow"]
video = ["av"]
media = ["arvel[image]"]
mail = ["aiosmtplib", "markdown-it-py"]
notifications = ["apprise"]
search = ["meilisearch"]
# pgvector powers `t.vector(...)` columns + vector search on Postgres. The Python package
# provides the SQLAlchemy type; it ALSO requires the Postgres server extension
# (`CREATE EXTENSION vector;`). Without the package, `t.vector` falls back to a portable JSON column.
vector = ["pgvector"]
telemetry = ["opentelemetry-sdk", "sentry-sdk", "logfire"]
i18n = ["babel"]
docs = ["zensical"]
dev = [
  "ruff", "mypy", "pyright", "bandit", "pip-audit", "pre-commit",
  "import-linter", "pytest", "pytest-asyncio", "pytest-xdist", "coverage",
  "polyfactory", "faker", "moto", "ipython", "hypothesis",
]
test-integration = ["testcontainers"]
standard = ["arvel[http,server,sqlite,postgres,redis,queue-redis,view,mail,image,console]"]
all = ["arvel[http,server,sqlite,postgres,mysql,redis,queue-redis,queue-amqp,view,console,vue,auth,jwt,oauth,2fa,rbac,s3,gcs,azure,supabase,image,video,media,mail,notifications,search,vector,telemetry,i18n]"]

[project.scripts]
arvel = "arvel.console:main"

[project.entry-points."arvel.providers"]
kernel = "arvel.kernel.provider:KernelServiceProvider"
events = "arvel.events.provider:EventServiceProvider"
security = "arvel.security.provider:SecurityServiceProvider"
client = "arvel.client.provider:ClientServiceProvider"
routing = "arvel.routing.provider:RoutingServiceProvider"
database = "arvel.database.provider:DatabaseServiceProvider"
cache = "arvel.cache.provider:CacheServiceProvider"
filesystem = "arvel.filesystem.provider:FilesystemServiceProvider"
mail = "arvel.mail.provider:MailServiceProvider"
notifications = "arvel.notifications.provider:NotificationServiceProvider"
view = "arvel.views.provider:ViewServiceProvider"
queue = "arvel.queue.provider:QueueServiceProvider"
auth = "arvel.auth.provider:AuthServiceProvider"
media = "arvel.media.provider:MediaServiceProvider"
validation = "arvel.validation.provider:ValidationServiceProvider"
dates = "arvel.dates.provider:DateServiceProvider"
localization = "arvel.localization.provider:LocalizationServiceProvider"
search = "arvel.search.provider:SearchServiceProvider"

[tool.hatch.version]
path = "src/arvel/__init__.py"  # reads __version__ (V1: one source of truth)

[tool.hatch.build.targets.wheel]
packages = ["src/arvel"]

# --- Lint / format --------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Generated facade stub: `make stubs` emits it verbatim and test_facade_stubs asserts the file
# equals the generator output. ruff-format must not rewrap it. force-exclude so the pre-commit
# ruff hooks (which pass filenames explicitly) honor the exclusion too.
extend-exclude = ["src/arvel/support/facades/__init__.pyi"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S404", "S603", "S607", "B018", "RUF012"]
"src/arvel/console/**" = ["B008", "S603"]  # Typer callable defaults; `serve` runs granian (fixed argv)

# --- Types (G3) -----------------------------------------------------------
[tool.mypy]
strict = true
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# We run BOTH mypy and pyright in strict mode. Pyright tracks "Unknown" more aggressively
# than mypy: isinstance-narrowing an `Any` gives pyright `list[Unknown]` (flagged) but mypy
# `list[Any]`. We resolve those spots with an explicit `cast(...)` for pyright — which mypy
# then sees as redundant. Disabling this one check keeps the dual-checker setup consistent
# without weakening real type safety (every real cast still type-checks).
warn_redundant_casts = false

[[tool.mypy.overrides]]
module = ["babel", "babel.*", "fsspec", "fsspec.*", "av", "av.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# Third-party engines (fsspec, av, …) ship no type stubs — silence the "missing stubs"
# noise about *their* packaging. This does NOT relax any check on our own code:
# reportUnknown* stay on; we funnel untyped boundaries through explicit Any.
reportMissingTypeStubs = false

# --- Tests ----------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default suite stays hermetic + fast: the Docker-backed integration tier is opt-in
# (`pytest -m integration` / `make test-integration`).
addopts = "-q -m 'not integration'"
markers = [
    "integration: real-service tests (Postgres/Redis/… via testcontainers; needs Docker)",
]

[tool.coverage.run]
source = ["arvel"]
branch = true

# --- Security -------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]

# --- G1 module boundaries (import-linter) ---------------------------------
[tool.importlinter]
root_package = "arvel"
include_external_packages = true
# The lazy public surface re-exports capability types under `if TYPE_CHECKING:`;
# those are type-only, not runtime imports, so they must not count as edges.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "G1a — kernel imports only contracts + support (+ stdlib)"
type = "forbidden"
source_modules = ["arvel.kernel"]
forbidden_modules = ["arvel.console"]
# capability modules (http/database/cache/...) are added to this list as they land

[[tool.importlinter.contracts]]
name = "G2 — light core imports no heavy libs (startup NFR)"
type = "forbidden"
# The light core must never import a heavy lib (even lazily). Capability modules
# (http→litestar, database→sqlalchemy, queue→taskiq, media→PIL) DO lazy-import their
# engine; that `import arvel` stays light is guaranteed by the -X importtime pytest.
source_modules = [
  "arvel.contracts",
  "arvel.kernel",
  "arvel.support",
  "arvel.dates",
  "arvel.localization",
  "arvel.events",
  "arvel.console",
  "arvel.security",
  "arvel.client",
]
forbidden_modules = ["litestar", "sqlalchemy", "taskiq", "PIL", "pydantic", "rich"]
ignore_imports = [
  # Application.as_asgi() is the serve entry-point: it builds the HTTP kernel only
  # when you actually serve. It stays light at `import arvel` (proven by the
  # importtime NFR test, tests/test_startup.py) — this static edge is unavoidable.
  "arvel.kernel.application -> arvel.http",
]
