services:
  backend:
    image: python:3.14.5-slim-bookworm
    working_dir: /workspace/kits/arvel-ecommerce-kit/backend
    env_file:
      - path: .env
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /workspace/.venv
      UV_LINK_MODE: copy
      PATH: /workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin
      CACHE_URL: redis://:${REDIS_PASSWORD:-arvel_local_redis_password}@redis:6379/0
    command: >
      bash -c "pip install --no-cache-dir --root-user-action=ignore uv==0.11.16 &&
      cd /workspace &&
      uv sync --frozen --all-packages --all-extras --no-dev &&
      cd kits/arvel-ecommerce-kit/backend &&
      arvel serve --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ../..:/workspace
      - backend-venv:/workspace/.venv
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 10

  frontend:
    image: node:24.15.0-alpine3.23
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8001
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: >
      sh -lc "npm ci --no-audit --no-fund &&
      npm run dev -- --host 0.0.0.0 --port 8000"
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  scheduler:
    image: python:3.14.5-slim-bookworm
    working_dir: /workspace/kits/arvel-ecommerce-kit/backend
    env_file:
      - path: .env
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /workspace/.venv
      UV_LINK_MODE: copy
      PATH: /workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin
      CACHE_URL: redis://:${REDIS_PASSWORD:-arvel_local_redis_password}@redis:6379/0
    command: >
      bash -c "pip install --no-cache-dir --root-user-action=ignore uv==0.11.16 &&
      cd /workspace &&
      uv sync --frozen --all-packages --all-extras --no-dev &&
      cd kits/arvel-ecommerce-kit/backend &&
      arvel schedule:work --sleep 60"
    volumes:
      - ../..:/workspace
      - scheduler-venv:/workspace/.venv
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-arvel_ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-arvel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arvel_local_password}
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8 --locale=C --auth-local=scram-sha-256 --auth-host=scram-sha-256
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-arvel} -d ${DB_DATABASE:-arvel_ecommerce}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cache + queue backend. Service name stays "redis" so existing REDIS_* env
  # vars and `redis://` URLs work unchanged. The image is Valkey — the BSD-3
  # fork the OSS ecosystem switched to after Redis went RSALv2/SSPL in 2024.
  # Same RESP3 wire protocol; the `valkey-server` / `valkey-cli` binaries are
  # the only difference from upstream Redis at the CLI surface.
  redis:
    image: valkey/valkey:9.1.0-alpine3.23
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-arvel_local_redis_password}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-arvel_local_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Pinned to the same tag the kit's test fixture uses (backend/tests/conftest.py).
  # MinIO archived its community edition in early 2026 — this is the last prebuilt
  # release and is fine for dev. Production deployments should bring their own bucket.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET:-minioadmin}
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # One-shot: create the bucket the kit expects and allow anonymous downloads
  # so Caddy can proxy reads without re-signing. Exits 0 on success.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set download "local/$$BUCKET" &&
        echo "Bucket $$BUCKET ready."
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET:-minioadmin}
      BUCKET: ${STORAGE_S3_BUCKET:-arvel-ecommerce-kit}

  # Browser-facing edge for the whole dev stack. Single origin (host :8002)
  # fans out to frontend (Vite dev server, default route), backend (/api/*),
  # MinIO (/media/* — matches STORAGE_LOCAL_URL=/media so the SPA sees one
  # URL shape across drivers), and Caddy's own /healthz. See Caddyfile for
  # routing. Backend writes hit minio:9000 directly inside the docker network.
  # Local-mode media is served by the backend at :8001/media/* (not via Caddy).
  #
  # `createbuckets` is listed here with `service_completed_successfully` for
  # two reasons. (1) Logical: Caddy proxies /media/* to MinIO, so the bucket
  # must exist before Caddy starts serving (otherwise the first image request
  # races createbuckets and 404s). (2) `docker compose up --wait` ergonomics:
  # without this link, --wait sees the one-shot createbuckets exit and reports
  # `Error 1` even when the stack is fully healthy, because nothing told
  # compose that createbuckets is meant to terminate. This dependency makes
  # `make up` reliably exit 0.
  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - "${CADDY_PORT:-8002}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-venv:
  frontend-node-modules:
  pgdata:
  redisdata:
  scheduler-venv:
  uv-cache:
  miniodata:
  caddydata:
  caddyconfig:
