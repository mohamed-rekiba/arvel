[project]
name = "arvel-ecommerce-kit"
version = "1.13.1" # x-release-please-version
description = "Arvel e-commerce starter kit."
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# postgres: asyncpg + psycopg, redis: cache, queue + queue-amqp: RabbitMQ jobs,
# mail: SMTP via Mailpit, s3: MinIO, jwt: token auth, broadcasting: WebSockets,
# bcrypt: password hashing, permission/image: published companion packages.
dependencies = [
    "arvel[postgres,redis,queue,queue-amqp,mail,s3,jwt,broadcasting,bcrypt,permission,image]",
]

[dependency-groups]
dev = [
    "arvel[shell]",
    "faker>=40.22.0",
    "httpx2>=2.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
# Self-contained config so a scaffolded kit (arvel new --kit ecommerce) runs the
# same way standalone as it does inside the monorepo. Without asyncio_mode the
# async security tests (escalation guards) silently don't run.
asyncio_mode = "auto"
# Parallel by default: the emulator suite shares one container stack across xdist
# workers (see tests/conftest.py), so --dist load spreads the heavy app-boot tests
# evenly. Drop to a single process for debugging with `-n0`.
addopts = "-n auto --dist loadfile"
testpaths = ["tests"]
markers = [
    "unit: pure-unit tests with no external dependencies",
    "integration: integration tests (require Docker)",
    "security: security-focused tests",
]

[tool.uv]
# Not a package. The kit ships as a GitHub Release tarball and is scaffolded
# verbatim by `arvel new --kit ecommerce` — never built, never published. It
# stays a workspace member only so `uv sync --all-packages` resolves the deps
# its own tests need.
package = false

[tool.uv.sources]
arvel = { workspace = true }
arvel-permission = { workspace = true }
arvel-image = { workspace = true }
