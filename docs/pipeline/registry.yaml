    schema: "squad-os-default (adapted: library increment)"
    autonomous: true
    has_frontend: false
    state_file: null
    notes: >
      Three lightweight lifecycle-wiring shortcuts. Model.on(event, cb) wraps the callable in a
      one-event _CallbackObserver and appends to the same observer list observe() uses, so
      callbacks share the dispatch path (cancellable False-return + async await). __observed_by__
      auto-registers observers in __init_subclass__ from cls.__dict__ (not inherited) via
      bind_observer. __dispatches_events__ maps a lifecycle name to a ModelEvent subclass dispatched
      on the Event facade after the observer loop in fire_async/fire_cancellable; no dispatcher
      bound => silently skipped (pure-DB tests stay green). ModelEvent is a top-level frozen Pydantic
      Event (arbitrary_types_allowed, model: Any) — defined directly, not via factory, so subclassing
      type-checks under strict. Also fixed pre-existing strict-pyright findings surfaced by the gate
      run: test_qb_like_and_joins column 'first' renamed to 'given' (shadowed QueryMixin.first), plus
      cast() narrowing in test_qb_clause_polish/test_wi017/test_wi018 and unused-symbol cleanups.
      ADR-139. Gates: arvel database+events 892 passed; mypy/pyright/ruff/bandit clean. 006-S9 DONE.
  - id: "WI-arvel-021"
