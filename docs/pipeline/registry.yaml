    autonomous: true
    has_frontend: false
    state_file: null
    notes: >
      Eloquent timestamp parity. Three ClassVars on Model: __timestamps__ (bool, default True),
      CREATED_AT/UPDATED_AT (str, default created_at/updated_at). Hook attachment moved from
      Timestamps.__init_subclass__ to Model.__init_subclass__ — before_insert/before_update mapper
      events attach only when __timestamps__ is truthy AND the model has the named attribute, so
      plain models pay nothing, the mixin still works, and custom-column models (declare own cols +
      set the constants) get auto-fill with no mixin. Hooks read the typed constants (str ClassVar,
      no Any widening). without_timestamps() async CM backed by _suppress_timestamps ContextVar
      (task-local, like without_events) skips auto-fill inside the block for imports/backfills.
      touch(attribute=None) sets the column to now and save()s (fires events); touch_quietly wraps
      without_events. replicate() now drops the constant-named timestamp cols. ADR-140. Gates: arvel
      database+events 901 passed (+9); mypy/pyright/ruff/bandit clean. 006-S12 DONE.
