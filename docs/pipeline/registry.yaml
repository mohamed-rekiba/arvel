      old/new JSON, AES-256-GCM encrypted when AUDIT_ENCRYPT_VALUES=true (lazy APP_KEY resolve).
      AuditLog query API (for_model/by_actor/action/since/until/get/first/count/paginate) — InvalidAuditAction
      on bad action; ORM Paginator for pages. Fluent activity(log, session).log().by().on().with_properties().save()
      => ActivityEntry; MissingActivityDescription without log(); subject's redacted keys stripped from
      properties at save. ActivityQuery for_subject/by_causer. audit:install publishes two migrations
      (audit_entries idx (model_type,model_id); activity_entries idx (subject_type,subject_id) +
      (causer_type,causer_id)), idempotent unless --force. Docs: docs/site/docs/audit.md; arvel[audit] extra.
