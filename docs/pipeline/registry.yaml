      deleting/deleted hooks at class definition (install_audit_observers, idempotent; re-asserted
      in provider boot via wire_all_auditable). Writes AuditEntry in the same transaction as the
      change: created => new={all cols}/old={}; updated => changed cols before/after (captured pre-flush
