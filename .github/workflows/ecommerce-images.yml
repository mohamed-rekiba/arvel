name: Ecommerce container images

# Builds production images for the ecommerce kit and opens a homelab-gitops PR.
#
# Triggers on kit release tags (e.g. arvel-ecommerce-kit-v1.5.1) or manual dispatch.
#
# Required secrets (arvel repo):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#   HOMELAB_GITOPS_TOKEN — fine-grained PAT on homelab-gitops with contents:write
#                          and pull_requests:write (fallback: RELEASE_PLEASE_TOKEN)

on:
  push:
    tags:
      - "arvel-ecommerce-kit-v[0-9]+.[0-9]+.[0-9]+"
      - "arvel-ecommerce-kit-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (semver, without v prefix)"
        required: true
        type: string
      bump_gitops:
        description: "Open homelab-gitops PR to bump image tags after push"
        required: false
        type: boolean
        default: true

env:
  DOCKERHUB_REPO_APP: rekiba/arvel-ecommerce-app
  DOCKERHUB_REPO_SCHEDULER: rekiba/arvel-ecommerce-scheduler
  GITOPS_REPO: mohamed-rekiba/homelab-gitops
  GITOPS_VALUES_PATH: ecommerce/chart/values.yaml

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#arvel-ecommerce-kit-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arvel-ecommerce-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kits/arvel-ecommerce-kit/deploy/Dockerfile
          target: app
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_REPO_APP }}:${{ steps.version.outputs.tag }}
            docker.io/${{ env.DOCKERHUB_REPO_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push arvel-ecommerce-scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kits/arvel-ecommerce-kit/deploy/Dockerfile
          target: scheduler
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_REPO_SCHEDULER }}:${{ steps.version.outputs.tag }}
            docker.io/${{ env.DOCKERHUB_REPO_SCHEDULER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-gitops:
    name: Open homelab-gitops image bump PR
    needs: build-and-push
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.bump_gitops }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require GitOps token
        env:
          HOMELAB_GITOPS_TOKEN: ${{ secrets.HOMELAB_GITOPS_TOKEN }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$HOMELAB_GITOPS_TOKEN" ] && [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Set HOMELAB_GITOPS_TOKEN (or RELEASE_PLEASE_TOKEN) on the arvel repo — needs contents:write and pull_requests:write on homelab-gitops"
            exit 1
          fi

      - name: Resolve image tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#arvel-ecommerce-kit-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.HOMELAB_GITOPS_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          path: gitops

      - name: Update Helm values image tags
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["IMAGE_TAG"]
          path = pathlib.Path("${{ env.GITOPS_VALUES_PATH }}")
          text = path.read_text()
          text = re.sub(
              r'(repository: docker\.io/rekiba/arvel-ecommerce-app\n\s+tag: )"[^"]*"',
              rf'\1"{tag}"',
              text,
              count=1,
          )
          text = re.sub(
              r'(repository: docker\.io/rekiba/arvel-ecommerce-scheduler\n\s+tag: )"[^"]*"',
              rf'\1"{tag}"',
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Open pull request on homelab-gitops
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_GITOPS_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          branch="chore/arvel-ecommerce-images-${IMAGE_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "${{ env.GITOPS_VALUES_PATH }}"

          if git diff --cached --quiet; then
            echo "Image tags already at ${IMAGE_TAG} — no PR needed"
            exit 0
          fi

          git commit -m "chore(ecommerce): bump images to ${IMAGE_TAG}"
          git push -u origin "${branch}"

          existing=$(gh pr list \
            --repo "${{ env.GITOPS_REPO }}" \
            --head "${branch}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${existing}" ]; then
            echo "Pull request already open: #${existing}"
            gh pr view "${existing}" --repo "${{ env.GITOPS_REPO }}" --web=false
            exit 0
          fi

          gh pr create \
            --repo "${{ env.GITOPS_REPO }}" \
            --head "${branch}" \
            --base main \
            --title "chore(ecommerce): bump images to ${IMAGE_TAG}" \
            --body "$(cat <<EOF
          Automated image tag bump from [\`${{ github.repository }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - \`docker.io/rekiba/arvel-ecommerce-app:${IMAGE_TAG}\`
          - \`docker.io/rekiba/arvel-ecommerce-scheduler:${IMAGE_TAG}\`

          Merge to let Argo CD sync the ecommerce chart.
          EOF
          )"
