name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.16"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: ruff check (workspace)
        run: uv run ruff check
      - name: ruff format --check (workspace)
        run: uv run ruff format --check

  typecheck:
    name: Type Check (mypy + pyright, --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: mypy --strict
        run: uv run mypy
      - name: pyright --strict
        run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: pytest with coverage (fail-under = 90)
        run: >-
          uv run pytest
          --cov=arvel
          --cov-report=term-missing
          --cov-report=xml
          --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  benchmark:
    name: Smoke Benchmark (perf NFRs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Run smoke benchmark
        run: uv run python benchmarks/bench_foundations.py
        # Non-blocking: regressions surface in PR output but don't fail CI.
        # Promote to a hard gate once we collect a baseline.
        continue-on-error: true

  integration:
    name: Integration Tests (Testcontainers emulators)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Pre-pull emulator images (parallel)
        run: make pull-emulators
      - name: Run integration suite
        run: make test-integration

  bench-reverb:
    name: Reverb Benchmarks (perf NFRs — hard gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Run reverb benchmarks
        # Hard gate per ADR-112 (WI-017). Thresholds in bench_reverb.py are
        # the code-internal NFR contract; gate values are 1.5× observed p99.
        # Re-calibrate via benchmarks/scripts/calibrate_bench_reverb.py if
        # flakes appear; never reintroduce continue-on-error.
        run: uv run python benchmarks/bench_reverb.py | tee bench-reverb-output.txt
      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-reverb-output
          path: bench-reverb-output.txt
          retention-days: 30

  bench-tracemalloc:
    name: Reverb Tracemalloc Bench (heap-byte gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Run tracemalloc bench
        # WI-017 / FR-017-011. Companion to bench-reverb; same script,
        # but the tracemalloc gate (96 MiB heap budget) catches sub-page
        # regressions that ru_maxrss can miss.
        run: uv run python benchmarks/bench_reverb.py | tee bench-tracemalloc-output.txt
      - name: Upload tracemalloc bench output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tracemalloc-output
          path: bench-tracemalloc-output.txt
          retention-days: 30

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: bandit (MEDIUM+ blocks; LOW allowlisted with rationale)
        # FR-017-013 / SEC-017-001. LOW findings are allowed via inline
        # `# nosec[B###]: rationale`; MEDIUM+ MUST be fixed or surfaced
        # by review. The packaged skeleton (template code rendered into
        # freshly-scaffolded user projects) is excluded — it belongs to
        # user code, not Arvel runtime.
        run: |
          uv run bandit \
            -r packages/arvel/src \
              packages/arvel-permission/src \
              packages/arvel-image/src \
            --exclude packages/arvel/src/arvel/_skeleton \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit.json
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: pip-audit
        # FR-017-014 / SEC-017-002. --skip-editable skips our own workspace
        # package (arvel), which is always editable in this monorepo;
        # --strict + --skip-editable is mutually exclusive, so the gate is
        # the exit code (non-zero on any unfixed CVE in a third-party dep).
        # Findings with no available fix go to
        # docs/security/dependency-exceptions.md with a re-eval date.
        run: >-
          uv run pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-89
          --ignore-vuln PYSEC-2025-183

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Check contributor-docs links
        run: uv run python scripts/check_doc_links.py
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict --site-dir _site
      - name: Upload docs site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site/
          retention-days: 14

  ecommerce-kit:
    name: E-commerce Kit (integration tests — PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - name: Run ecommerce-kit integration suite
        working-directory: kits/arvel-ecommerce-kit/backend
        env:
          APP_ENV: testing
        run: >-
          uv run --project ../../.. pytest tests/
          --tb=short -q

  ecommerce-kit-frontend:
    name: E-commerce Kit Frontend (format + lint + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: kits/arvel-ecommerce-kit/frontend/package-lock.json
      - name: npm ci (ecommerce frontend)
        working-directory: kits/arvel-ecommerce-kit/frontend
        run: npm ci
      - name: Prettier check
        working-directory: kits/arvel-ecommerce-kit/frontend
        run: npm run format-check
      - name: ESLint (max-warnings 0)
        working-directory: kits/arvel-ecommerce-kit/frontend
        run: npm run lint
      - name: Vitest
        working-directory: kits/arvel-ecommerce-kit/frontend
        run: npm run test
      - name: Vite build
        working-directory: kits/arvel-ecommerce-kit/frontend
        run: npm run build

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, integration, ecommerce-kit, ecommerce-kit-frontend, docs]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build arvel
        run: uv build --package arvel --out-dir dist/arvel
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
