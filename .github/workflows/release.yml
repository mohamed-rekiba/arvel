name: Release

# WI-017 / FR-017-021. Triggered by pushing a v*.*.* tag.
# This workflow VALIDATES a release artifact via `twine check` and prints the
# manual publish command. It does NOT call `twine upload`. Actual PyPI
# publishing requires Trusted Publisher setup (documented in
# docs/ops/deployment-checklist-017.md) and is a one-time manual operation
# by the maintainer.
#
# SEC-017-004: This workflow fails closed by default — no credentials, no
# upload step. Misconfiguration cannot result in an unintended publish.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.16"

jobs:
  validate:
    name: Validate release artifacts (dry-run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --all-extras --frozen

      - name: Build distributions
        run: uv build --package arvel --out-dir dist/arvel

      - name: twine check (metadata validation, dry-run)
        # FR-017-021: dry-run only. Verifies the wheel + sdist metadata are
        # PyPI-compatible. Does NOT upload.
        run: uvx twine check dist/arvel/*

      - name: Print manual publish instructions
        run: |
          echo "::group::Manual publish steps (operator)"
          echo "The 'arvel' artifact is validated and ready."
          echo ""
          echo "To publish to PyPI (one-time setup required first):"
          echo "  1. Configure PyPI Trusted Publisher for this repo:"
          echo "     https://docs.pypi.org/trusted-publishers/"
          echo "  2. Switch this workflow to use 'pypa/gh-action-pypi-publish@release/v1'"
          echo "  3. Re-tag the release."
          echo ""
          echo "Until then, publish manually from a clean environment:"
          echo "  uvx twine upload --repository pypi dist/arvel/*"
          echo "::endgroup::"

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          retention-days: 90
