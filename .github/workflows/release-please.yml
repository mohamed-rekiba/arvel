name: Release Please

# Opens per-package release PRs on every push to `main`. Each workspace
# package versions independently (see release-please-config.json +
# release-please-manifest.json). When a release PR is merged, release-please
# creates a component-prefixed tag (e.g. `arvel-v1.0.1`,
# `arvel-permission-v0.4.0`) plus a GitHub Release. The companion
# `publish.yml` workflow then builds the matching package and uploads it to
# PyPI via Trusted Publishing, and attaches the distribution to the Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.16"

jobs:
  release-please:
    name: Open / update release PRs
    runs-on: ubuntu-24.04
    outputs:
      kit_released: ${{ steps.release.outputs['kits/arvel-ecommerce-kit--release_created'] }}
      kit_tag: ${{ steps.release.outputs['kits/arvel-ecommerce-kit--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          # A PAT or GitHub App token is required so the tags release-please
          # creates trigger publish.yml. Tags pushed with the default
          # GITHUB_TOKEN do NOT emit events (GitHub blocks recursive runs), so
          # auto-publish stays dormant until RELEASE_PLEASE_TOKEN is set.
          # The kit tarball is attached by the archive-kit job below instead of
          # a tag-triggered workflow, so it lands even on the default token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  archive-kit:
    name: Archive e-commerce kit and attach to its release
    needs: release-please
    if: needs.release-please.outputs.kit_released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the archive + checksum to the GitHub Release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.kit_tag }}

      - name: Build kit tarball + checksum
        id: build
        run: |
          set -euo pipefail
          tag="${{ needs.release-please.outputs.kit_tag }}"
          version="${tag#arvel-ecommerce-kit-v}"
          prefix="arvel-ecommerce-kit-${version}"
          archive="${prefix}.tar.gz"
          # git archive only ships tracked files (no node_modules / dist / caches)
          # and hoists the subtree under <prefix>/ so the CLI strips one level.
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "${archive}" HEAD:kits/arvel-ecommerce-kit
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.build.outputs.tag }}" \
            "${{ steps.build.outputs.archive }}" \
            "${{ steps.build.outputs.archive }}.sha256" \
            --clobber

  update-lockfile:
    name: Regenerate uv.lock on release PRs
    needs: release-please
    # A version bump in any package's pyproject.toml invalidates the shared
    # uv.lock (it pins every workspace member's version). Every CI job runs
    # --frozen, so without this each release PR would fail. Because packages
    # release via separate PRs, regenerate the lockfile on every open
    # release-please PR branch — not just one.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Regenerate uv.lock on each open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(gh pr list --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--main")) | .headRefName')
          if [ -z "${branches}" ]; then
            echo "No open release-please PRs; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for branch in ${branches}; do
            echo "::group::${branch}"
            git fetch origin "${branch}"
            git checkout "${branch}"
            uv lock
            if git diff --quiet uv.lock; then
              echo "uv.lock already up to date on ${branch}"
            else
              # Fold the lockfile into release-please's own commit instead of
              # adding a second commit, so the release PR stays one commit.
              git add uv.lock
              git commit --amend --no-edit
              git push --force-with-lease origin "HEAD:${branch}"
            fi
            git checkout -
            echo "::endgroup::"
          done
