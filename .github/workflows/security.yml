name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 03:17 UTC catches new CVEs in pinned deps without waiting for PRs.
    - cron: "17 3 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.16"

jobs:
  sast-bandit:
    name: SAST (bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: bandit (low+)
        # The packaged skeleton under src/arvel/_skeleton is template code
        # rendered into freshly-scaffolded user projects, not Arvel runtime
        # code — its asserts and other patterns belong to user code, not us.
        run: uv run bandit -r packages/arvel/src -l --exclude packages/arvel/src/arvel/_skeleton
      - name: bandit (companion packages — arvel-permission, arvel-image)
        run: |
          uv run bandit -r packages/arvel-permission/src -l
          uv run bandit -r packages/arvel-image/src -l
  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@v6
      - name: semgrep auto-config
        run: semgrep ci --config=auto --error
        env:
          SEMGREP_RULES: "p/python p/security-audit p/owasp-top-ten"

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: pip-audit (skip editable workspace members)
        # Unfixed CVEs: docs/security/dependency-exceptions.md
        run: >-
          uv run pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-89
          --ignore-vuln PYSEC-2025-183

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    needs: [sca]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Generate CycloneDX SBOM (arvel)
        run: |
          uv export --no-dev --no-hashes --package arvel --format requirements-txt > req-arvel.txt
          uv run cyclonedx-py requirements \
            --pyproject packages/arvel/pyproject.toml \
            --output-format JSON \
            --output-file sbom-arvel.cdx.json \
            req-arvel.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: sbom-*.cdx.json
          retention-days: 90
