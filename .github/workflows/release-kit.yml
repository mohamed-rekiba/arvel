name: Release Kit

# Packages the e-commerce kit as a release tarball when its release-please tag
# is pushed (e.g. `arvel-ecommerce-kit-v1.0.0`). The kit is NOT a PyPI package
# — `arvel new --kit ecommerce` downloads this tarball at runtime. `publish.yml`
# deliberately skips this tag (see its publish_pypi guard).

on:
  push:
    tags:
      - "arvel-ecommerce-kit-v[0-9]+.[0-9]+.[0-9]+"
      - "arvel-ecommerce-kit-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # attach the archive + checksum to the GitHub Release

jobs:
  archive:
    name: Archive kit and attach to release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build kit tarball + checksum
        id: build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#arvel-ecommerce-kit-v}"
          prefix="arvel-ecommerce-kit-${version}"
          archive="${prefix}.tar.gz"
          # git archive only includes tracked files, so node_modules / dist /
          # build caches never make it in. The subtree is hoisted to the
          # archive root under <prefix>/ so the CLI can strip one level.
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "${archive}" HEAD:kits/arvel-ecommerce-kit
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.build.outputs.archive }}" \
            "${{ steps.build.outputs.archive }}.sha256" \
            --clobber
