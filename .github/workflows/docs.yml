name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs Pages enabled on the repo (Settings → Pages → GitHub Actions).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: zensical build
        run: uv run zensical build
      - uses: actions/upload-pages-artifact@v5
        with:
          # zensical.toml → site_dir = ".site"
          path: .site

  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
