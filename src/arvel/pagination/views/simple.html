{# Simple (prev/next) paginator (Tailwind). Renders nothing when there is a single page. #}
{% if paginator.has_pages() %}
<nav role="navigation" aria-label="Pagination Navigation" class="flex justify-between">
  {% if paginator.on_first_page() %}
    <span class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-gray-400 bg-white border border-gray-300 cursor-default rounded-md">&laquo; Previous</span>
  {% else %}
    <a href="{{ paginator.previous_page_url() }}" rel="prev" class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:text-gray-500">&laquo; Previous</a>
  {% endif %}

  {% if paginator.has_more_pages() %}
    <a href="{{ paginator.next_page_url() }}" rel="next" class="relative inline-flex items-center px-4 py-2 ml-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:text-gray-500">Next &raquo;</a>
  {% else %}
    <span class="relative inline-flex items-center px-4 py-2 ml-3 text-sm font-medium text-gray-400 bg-white border border-gray-300 cursor-default rounded-md">Next &raquo;</span>
  {% endif %}
</nav>
{% endif %}
