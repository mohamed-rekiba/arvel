[project]
name = "arvel-audit"
version = "0.5.0" # x-release-please-version
description = "Audit trail and activity log for Arvel — automatic model change history plus a fluent business-event recorder."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
keywords = ["arvel", "audit", "activity-log", "auditing", "change-history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "arvel",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
]

[project.urls]
Homepage = "https://arvel.dev"
Documentation = "https://arvel.dev/packages/audit/"
Repository = "https://github.com/mohamed-rekiba/arvel"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvel_audit"]
include = ["src/arvel_audit/py.typed"]
