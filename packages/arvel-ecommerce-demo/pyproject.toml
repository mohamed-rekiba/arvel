[project]
name = "arvel-ecommerce-demo"
version = "0.1.0"
description = "Arvel e-commerce demo application."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# postgres: asyncpg + psycopg, redis: cache, queue + queue-amqp: RabbitMQ jobs,
# mail: SMTP via Mailpit, s3: MinIO, jwt: token auth, broadcasting: WebSockets,
# bcrypt: password hashing, permission/image: published companion packages.
# python-multipart: FastAPI parses multipart/form-data (image uploads).
dependencies = [
    "arvel[postgres,redis,queue,queue-amqp,mail,s3,jwt,broadcasting,bcrypt,permission,image]>=1.0.0",
    "python-multipart>=0.0.29",
]

[dependency-groups]
dev = [
    "arvel[shell]",
    "faker>=40.18.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
]

[tool.uv.sources]
arvel = { workspace = true }
arvel-permission = { workspace = true }
arvel-image = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "src/arvel_ecommerce_demo"]
