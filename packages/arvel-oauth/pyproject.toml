[project]
name = "arvel-oauth"
version = "0.5.0" # x-release-please-version
description = "OAuth2/OIDC login for Arvel — Google, GitHub, Microsoft, Apple, and generic OIDC."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
keywords = ["arvel", "oauth", "oauth2", "oidc", "sso", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "arvel",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/mohamed-rekiba/arvel"
Documentation = "https://github.com/mohamed-rekiba/arvel/tree/main/packages/arvel-oauth"
Repository = "https://github.com/mohamed-rekiba/arvel"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvel_oauth"]
include = ["src/arvel_oauth/py.typed"]
