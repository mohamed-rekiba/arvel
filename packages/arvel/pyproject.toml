[project]
name = "arvel"
version = "0.19.0" # x-release-please-version
description = "The Laravel of Python — FastAPI + Pydantic + SQLAlchemy, end-to-end type-safe."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
keywords = ["framework", "web", "fastapi", "pydantic", "sqlalchemy", "laravel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "alembic>=1.18.4",
    "pyyaml>=6.0.3",
    "anyio>=4.13.0",
    "argon2-cffi>=25.1.0",
    "croniter>=6.2.2",
    "cryptography>=48.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "httpx2>=2.3.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "msgspec>=0.21.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "starlette>=1.2.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-exporter-prometheus>=0.63b1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-instrumentation-logging>=0.63b1",
    "structlog>=25.5.0",
    "typer>=0.26.4",
    "uvicorn[standard]>=0.48.0",
    "aiohttp>=3.14.0",
]

[project.optional-dependencies]
bcrypt = ["bcrypt>=5.0.0"]
redis = ["redis>=7.4.0"]
postgres = ["asyncpg>=0.31.0", "psycopg[binary]>=3.3.4"]
mysql = ["aiomysql>=0.3.2", "pymysql>=1.2.0"]
sqlite = ["aiosqlite>=0.22.1"]
queue = ["taskiq>=0.12.4"]
queue-redis = ["taskiq-redis>=1.2.2"]
queue-amqp = ["taskiq-aio-pika>=0.6.0"]
mail = ["aiosmtplib>=5.1.1", "premailer>=3.10.0"]
s3 = ["aioboto3>=15.5.0", "boto3>=1.40.61"]
gcs = ["google-cloud-storage>=3.10.1"]
azure = ["azure-storage-blob>=12.29.0"]
jwt = ["authlib>=1.7.2", "pyjwt[crypto]>=2.13.0"]
broadcasting = ["websockets>=16.0"]
shell = ["ipython>=9.14.0"]
openapi = ["openapi-spec-validator>=0.9.0"]
permission = ["arvel-permission"]
image = ["arvel-image"]
image-heif = ["arvel-image[heif]"]
oauth = ["arvel-oauth"]
search = ["arvel-search"]
audit = ["arvel-audit"]
dev = ["faker>=40.19.1", "fakeredis>=2.36.0", "moto[s3]>=5.2.1"]
all = [
    "arvel[bcrypt,redis,postgres,mysql,sqlite,queue,queue-redis,queue-amqp,mail,s3,gcs,azure,jwt,broadcasting,shell,permission,image,image-heif,oauth,search,audit,openapi,dev]",
]

[project.scripts]
arvel = "arvel.console.entrypoint:main"

[project.entry-points."arvel.commands"]
# Built-in CLI commands declared as entry-points so the CLI bootstrap doesn't
# hardcode them and optional commands (e.g. `reverb:start` when [broadcasting]
# is installed) plug in cleanly. Queue commands (queue:work/failed/retry/flush/
# forget) are intentionally NOT declared here — they need DI from the framework
# container and load via ConsoleServiceProvider.boot() from a running Application.

# project scaffolder (works outside an Arvel project)
"new" = "arvel.console.commands.new:NewCommand"
# scaffolding (make:*)
"make:controller" = "arvel.console.commands.make_controller:MakeControllerCommand"
"make:model" = "arvel.console.commands.make_model:MakeModelCommand"
"make:service" = "arvel.console.commands.make_service:MakeServiceCommand"
"make:job" = "arvel.console.commands.make_job:MakeJobCommand"
"make:event" = "arvel.console.commands.make_event:MakeEventCommand"
"make:middleware" = "arvel.console.commands.make_middleware:MakeMiddlewareCommand"
"make:policy" = "arvel.console.commands.make_policy:MakePolicyCommand"
"make:provider" = "arvel.console.commands.make_provider:MakeProviderCommand"
"make:request" = "arvel.console.commands.make_request:MakeRequestCommand"
"make:seeder" = "arvel.console.commands.make_seeder:MakeSeederCommand"
"make:migration" = "arvel.console.commands.make_migration:MakeMigrationCommand"
# scaffolding additions
"make:test" = "arvel.console.commands.make_test:MakeTestCommand"
"make:factory" = "arvel.console.commands.make_factory:MakeFactoryCommand"
"make:listener" = "arvel.console.commands.make_listener:MakeListenerCommand"
"make:notification" = "arvel.console.commands.make_notification:MakeNotificationCommand"
"make:mail" = "arvel.console.commands.make_mail:MakeMailCommand"
"make:command" = "arvel.console.commands.make_command:MakeCommandCommand"
"make:resource" = "arvel.console.commands.make_resource:MakeResourceCommand"
"make:schema" = "arvel.console.commands.make_schema:MakeSchemaCommand"
"make:cast" = "arvel.console.commands.make_cast:MakeCastCommand"
"make:observer" = "arvel.console.commands.make_observer:MakeObserverCommand"
"make:channel" = "arvel.console.commands.make_channel:MakeChannelCommand"
"make:view" = "arvel.console.commands.make_view:MakeViewCommand"
# publishing — replaces the old per-table make:<feature>-table commands
"vendor:publish" = "arvel.console.commands.vendor_publish:VendorPublishCommand"
"config:publish" = "arvel.console.commands.config_commands:ConfigPublishCommand"
# migrations
"migrate" = "arvel.console.commands.migrate:MigrateCommand"
"migrate:rollback" = "arvel.console.commands.migrate:MigrateRollbackCommand"
"migrate:status" = "arvel.console.commands.migrate:MigrateStatusCommand"
"migrate:fresh" = "arvel.console.commands.migrate_fresh:MigrateFreshCommand"
"migrate:reset" = "arvel.console.commands.migrate_reset:MigrateResetCommand"
"migrate:refresh" = "arvel.console.commands.migrate_refresh:MigrateRefreshCommand"
# ops + infra
"route:list" = "arvel.console.commands.route_list:RouteListCommand"
"db:seed" = "arvel.console.commands.db_seed:DbSeedCommand"
"db:show" = "arvel.console.commands.db_show:DbShowCommand"
"db:table" = "arvel.console.commands.db_table:DbTableCommand"
"config:show" = "arvel.console.commands.config_commands:ConfigShowCommand"
"model:show" = "arvel.console.commands.model_show:ModelShowCommand"
"channel:list" = "arvel.console.commands.channel_list:ChannelListCommand"
"event:list" = "arvel.console.commands.event_list:EventListCommand"
"key:generate" = "arvel.console.commands.key_generate:KeyGenerateCommand"
"key:rotate" = "arvel.console.commands.key_rotate:KeyRotateCommand"
"serve" = "arvel.console.commands.serve:ServeCommand"
"about" = "arvel.console.commands.about:AboutCommand"
"shell" = "arvel.console.commands.shell:ShellCommand"
"tinker" = "arvel.console.commands.tinker:TinkerCommand"
"storage:link" = "arvel.console.commands.storage_link:StorageLinkCommand"
"storage:unlink" = "arvel.console.commands.storage_unlink:StorageUnlinkCommand"
"auth:clear-resets" = "arvel.console.commands.auth_clear_resets:AuthClearResetsCommand"
"test" = "arvel.console.commands.test_command:TestCommand"
"down" = "arvel.console.commands.maintenance:DownCommand"
"up" = "arvel.console.commands.maintenance:UpCommand"
# openapi
"openapi:export" = "arvel.console.commands.openapi_export:OpenApiExportCommand"
"openapi:validate" = "arvel.console.commands.openapi_validate:OpenApiValidateCommand"
# queue
"queue:restart" = "arvel.console.commands.queue_restart:QueueRestartCommand"
"queue:clear" = "arvel.console.commands.queue_clear:QueueClearCommand"
"queue:prune-failed" = "arvel.console.commands.queue_prune_failed:QueuePruneFailedCommand"
# cache
"cache:clear" = "arvel.console.commands.cache_commands:CacheClearCommand"
"cache:forget" = "arvel.console.commands.cache_commands:CacheForgetCommand"
# config caching
"config:cache" = "arvel.console.commands.config_commands:ConfigCacheCommand"
"config:clear" = "arvel.console.commands.config_commands:ConfigClearCommand"
# views
"view:cache" = "arvel.console.commands.view_commands:ViewCacheCommand"
"view:clear" = "arvel.console.commands.view_commands:ViewClearCommand"
# optimize
"optimize" = "arvel.console.commands.optimize:OptimizeCommand"
"optimize:clear" = "arvel.console.commands.optimize:OptimizeClearCommand"
# scheduler
"schedule:work" = "arvel.console.commands.schedule_commands:ScheduleWorkCommand"
"schedule:list" = "arvel.console.commands.schedule_commands:ScheduleListCommand"
"schedule:run" = "arvel.console.commands.schedule_run:ScheduleRunCommand"
"schedule:interrupt" = "arvel.console.commands.schedule_commands:ScheduleInterruptCommand"
"schedule:pause" = "arvel.console.commands.schedule_commands:SchedulePauseCommand"
"schedule:continue" = "arvel.console.commands.schedule_commands:ScheduleContinueCommand"
# model operations
"model:prune" = "arvel.console.commands.model_prune:ModelPruneCommand"
# broadcasting (loads only when [broadcasting] extra is installed — discover_commands
# tolerates the ImportError when websockets is missing)
"reverb:start" = "arvel.console.commands.reverb_commands:ReverbStartCommand"

[project.urls]
Homepage = "https://arvel.dev"
Documentation = "https://arvel.dev"
Repository = "https://github.com/mohamed-rekiba/arvel"
Issues = "https://github.com/mohamed-rekiba/arvel/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvel", "src/arvent"]
include = ["src/arvel/py.typed", "src/arvent/py.typed"]
