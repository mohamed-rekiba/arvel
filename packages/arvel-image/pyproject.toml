[project]
name = "arvel-image"
version = "0.9.0" # x-release-please-version
description = "Fluent, type-safe image manipulation and polymorphic media library for Arvel."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Arvel contributors" }]
keywords = ["arvel", "image", "pillow", "media", "thumbnail", "resize", "upload"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["arvel", "Pillow>=12.2.0", "python-multipart>=0.0.32"]

[project.optional-dependencies]
heif = ["pillow-heif>=1.3.0"]

[project.urls]
Homepage = "https://arvel.dev"
Documentation = "https://arvel.dev/packages/image/"
Repository = "https://github.com/mohamed-rekiba/arvel"
Issues = "https://github.com/mohamed-rekiba/arvel/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arvel_image"]
include = ["src/arvel_image/py.typed"]
