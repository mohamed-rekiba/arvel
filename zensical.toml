# arvel documentation — built with Zensical (the Material team's static site generator).
# Brand: monochromatic blue ramp (primary blue #0A4174 · accent sky #7BBDE8); LIGHT
# is the default scheme (santifer.io-style restraint), dark uses navy #001D39 as the
# canvas. The logo has a light-bg (deep+steel) and dark-bg (sky+pale) variant. Brand
# tokens live in the extra_css below (assets/arvel-docs-theme.css) — see the design
# system at projects/arvel/design/DESIGN.md.

[project]
site_name = "arvel"
site_dir = ".site"
site_description = "A batteries-included async web framework for Python — type-safe, modular, and fast by default."
site_url = "https://arvel.dev/"
site_author = "arvel"
repo_url = "https://github.com/mohamed-rekiba/arvel"
repo_name = "mohamed-rekiba/arvel"
copyright = "Copyright © 2026 arvel team. All rights reserved."

extra_css = ["assets/arvel-docs-theme.css"]
extra_javascript = ["assets/arvel-snake.js", "assets/arvel-nav.js"]

