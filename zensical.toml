[project.theme]
logo = "assets/arvel-mark.svg"           # deep mark for the light header; CSS swaps to the sky mark in dark
favicon = "assets/arvel-mark.svg"        # deep mark for light browser chrome
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  # "navigation.sections",
  # "navigation.expand" is off: only "Getting Started" opens expanded (still
  # collapsible), via assets/arvel-nav.js (#__nav_2) — zensical has no
  # per-section expand option.
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# GitHub mark for the header repo link (repo_url above).
[project.theme.icon]
repo = "fontawesome/brands/github"

# Light (default) first → default scheme, matching the santifer.io reference.
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Footer links — GitHub + PyPI (rendered as social icons in the footer).
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mohamed-rekiba/arvel"
name = "arvel on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/arvel/"
name = "arvel on PyPI"
