# arvel documentation — built with Zensical (the Material team's static site generator).
# Brand: monochromatic blue ramp (primary blue #0A4174 · accent sky #7BBDE8); LIGHT
# is the default scheme (santifer.io-style restraint), dark uses navy #001D39 as the
# canvas. The logo has a light-bg (deep+steel) and dark-bg (sky+pale) variant. Brand
# tokens live in the extra_css below (assets/arvel-docs-theme.css) — see the design
# system at projects/arvel/design/DESIGN.md.

[project]
site_name = "arvel"
site_dir = ".site"
site_description = "A batteries-included async web framework for Python — type-safe, modular, and fast by default."
site_url = "https://arvel.dev/"
site_author = "arvel"
repo_url = "https://github.com/mohamed-rekiba/arvel"
repo_name = "mohamed-rekiba/arvel"
copyright = "Copyright © 2026 arvel team. All rights reserved."

extra_css = ["assets/arvel-docs-theme.css"]
extra_javascript = ["assets/arvel-snake.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "The Basics" = [
    { "Configuration" = "configuration.md" },
    { "Routing" = "routing.md" },
    { "Database & ORM" = [
      { "Overview" = "database/index.md" },
      { "Queries" = "database/queries.md" },
      { "Relationships" = "database/relationships.md" },
      { "Migrations & Schema" = "database/migrations.md" },
      { "Casts & Serialization" = "database/casts.md" },
      { "Factories" = "database/factories.md" },
      { "Transactions & Streaming" = "database/transactions.md" },
      { "CTEs & Recursive Queries" = "database/ctes.md" },
      { "SQL Views & Functions" = "database/sql-views.md" },
      { "JSON, Full-text & Vectors" = "database/json-search.md" },
    ] },
    { "Middleware" = "middleware.md" },
    { "Validation" = "validation.md" },
    { "Pagination" = "pagination.md" },
    { "Views" = "views.md" },
  ] },
  { "Architecture" = [
    { "Service Container" = "container.md" },
    { "Service Providers" = "providers.md" },
    { "Facades" = "facades.md" },
    { "Packaging & Extras" = "packaging.md" },
  ] },
  { "Authentication & Authorization" = [
    { "Overview" = "auth/index.md" },
    { "Authentication" = "auth/authentication.md" },
    { "Guards & drivers" = "auth/guards.md" },
    { "Identities & account linking" = "auth/identities.md" },
    { "Single sign-on (OIDC)" = "auth/sso-oidc.md" },
    { "OAuth2 social login" = "auth/oauth.md" },
    { "Authorization" = "auth/authorization.md" },
    { "IdP groups → roles" = "auth/idp-roles.md" },
    { "API tokens" = "auth/api-tokens.md" },
    { "Two-factor auth" = "auth/two-factor.md" },
    { "Routes & flows" = "auth/routes-and-flows.md" },
    { "Providers & middleware" = "auth/providers-and-middleware.md" },
    { "Configuration" = "auth/configuration.md" },
  ] },
  { "Digging Deeper" = [
    { "HTTP Client" = "http-client.md" },
    { "Cache" = "cache.md" },
    { "Search" = "search.md" },
    { "Activity Log" = "activitylog.md" },
    { "Queues & Jobs" = "queues.md" },
    { "Events" = "events.md" },
    { "Mail" = "mail.md" },
    { "Notifications" = "notifications.md" },
    { "Telemetry" = "telemetry.md" },
    { "Console (CLI)" = "console.md" },
    { "Dates & Time" = "dates.md" },
    { "File Storage" = "storage.md" },
    { "Images & Video" = "media.md" },
    { "Helpers & Collections" = "helpers.md" },
    { "Money" = "money.md" },
    { "Localization" = "localization.md" },
    { "Testing" = "testing.md" },
  ] },
  { "Prologue" = [
    { "Architecture Concepts" = "architecture.md" },
    { "About arvel" = "about.md" },
  ] },
]

[project.theme]
logo = "assets/arvel-mark.svg"           # deep mark for the light header; CSS swaps to the sky mark in dark
favicon = "assets/arvel-mark.svg"        # deep mark for light browser chrome
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  # "navigation.sections",
  "navigation.expand",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# GitHub mark for the header repo link (repo_url above).
[project.theme.icon]
repo = "fontawesome/brands/github"

# Light (default) first → default scheme, matching the santifer.io reference.
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Footer links — GitHub + PyPI (rendered as social icons in the footer).
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mohamed-rekiba/arvel"
name = "arvel on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/arvel/"
name = "arvel on PyPI"
