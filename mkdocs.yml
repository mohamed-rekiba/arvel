# Arvel — Documentation Site
#
# Configuration follows the idioms used by mkdocs-material's own docs
# (see https://github.com/squidfunk/mkdocs-material/blob/master/mkdocs.yml).
# Information architecture mirrors Laravel's documentation sidebar so users
# coming from Laravel feel at home. Internal engineering artifacts (PRDs,
# SADs, ADRs, ops handovers) live under `docs/` but are not built into the
# public site.

# Project information
site_name: Arvel
site_url: https://arvel.dev/
site_author: Arvel contributors
site_description: >-
  The clean stack for Python developers and agents — a typed, async-first Python
  web framework with Laravel-grade developer experience.

# Repository
repo_name: mohamed-rekiba/arvel
repo_url: https://github.com/mohamed-rekiba/arvel
edit_uri: edit/main/docs/site/

# Copyright
copyright: Copyright &copy; 2026 Arvel contributors

# Where the docs live
docs_dir: docs/site

# Configuration
theme:
  name: material
  custom_dir: docs/site/overrides
  logo: assets/brand/arvel-mark-dark.svg
  favicon: assets/brand/favicon.svg
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.prune
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Custom brand colors (the one thing mkdocs-material can't do via config alone)
extra_css:
  - stylesheets/extra.css

# Additional configuration
extra:
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mohamed-rekiba/arvel
      name: Arvel on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/arvel/
      name: Arvel on PyPI
  # Open Graph / social card image used by theme overrides (overrides/main.html)
  og_image: assets/brand/og-card.png
  og_image_width: 1200
  og_image_height: 630

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Converts GitHub-style callouts (> [!NOTE]) into Material admonitions at build time.
  - gh-admonitions
  # Renders the API reference from the installed `arvel` package's docstrings +
  # type signatures. signature_crossrefs is off on purpose: under `strict`, an
  # unresolved annotation cross-ref is a fatal warning, and we'd rather ship.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: arvel-framework
      repo: arvel
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

